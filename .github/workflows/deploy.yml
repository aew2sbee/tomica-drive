name: Deploy to GitHub Pages

# Production: publish main to the root of the gh-pages branch (no build step).
# PR previews live under pr-preview/ on the same branch and are left untouched.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Collect only the published files (same list as preview.yml; add each file there too).
      - run: |
          mkdir _site
          cp -r .nojekyll _site/
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: pr-preview/
          force: false
